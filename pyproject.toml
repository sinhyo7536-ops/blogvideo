[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blogvideo"
version = "0.1.0"
description = "네이버 블로그 글을 유튜브용 영상으로 만드는 로컬 웹 앱"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "anthropic>=2.8",
  "edge-tts>=7.3",
  "pillow>=10",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "truststore>=0.10",
  "google-genai>=3.2",  # [임시] Gemini 무료 API
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "playwright>=1.40", "numpy>=1.26"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = ["e2e: browser end-to-end tests", "network: needs internet"]
