name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download FFmpeg 9.0.2 (gyan.dev essentials, pinned + SHA256 verified)
        run: |
          # 버전 고정(2026-11-24): 최신판(9.1)으로 바뀌자 확대 떨림 시험이 깨졌다. 확인한 버전만 넣는다.
          $url = "https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          $expected = "60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba"
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) { throw "FFmpeg checksum mismatch: $expected vs $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extract
          $dir = Get-ChildItem ffmpeg_extract -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Copy-Item "$($dir.FullName)\bin\ffmpeg.exe", "$($dir.FullName)\bin\ffprobe.exe" ffmpeg\
          Copy-Item "$($dir.FullName)\LICENSE" ffmpeg\LICENSE.txt
          Copy-Item "$($dir.FullName)\README.txt" ffmpeg\README.txt -ErrorAction SilentlyContinue
          & .\ffmpeg\ffmpeg.exe -version | Select-Object -First 1

      - name: Run tests
        run: |
          $env:PATH = "$PWD\ffmpeg;$env:PATH"
          pytest -q -m "not e2e"

      - name: Check real Edge TTS (Korean voices)
        run: |
          $env:PATH = "$PWD\ffmpeg;$env:PATH"
          python -c "import asyncio, pathlib; from app.netsetup import use_system_certificates; assert use_system_certificates(); from app.tts import synthesize_scene, probe_duration; p = pathlib.Path('tts_check.mp3'); asyncio.run(synthesize_scene('안녕하세요. 블로그 영상 변환기 음성 테스트입니다.', 'ko-KR-SunHiNeural', p)); print('Edge TTS OK, seconds =', probe_duration(p))"

      - name: Build app (signed official Python, no PyInstaller)
        run: |
          # 서명 없는 실행 파일(PyInstaller)은 백신에 걸렸다 → 파이썬 재단이 서명한 공식 파이썬으로 켠다
          python packaging/build_app.py --out build/app
          $sig = Get-AuthenticodeSignature build\app\runtime\pythonw.exe
          if ($sig.Status -ne "Valid" -or $sig.SignerCertificate.Subject -notmatch "Python Software Foundation") { throw "pythonw.exe is not signed by the PSF" }
          Write-Host "pythonw.exe signed by: $($sig.SignerCertificate.Subject)"
          $unsigned = Get-ChildItem build\app -Recurse -Include *.exe | Where-Object { $_.FullName -notmatch "\\ffmpeg\\" } | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne "Valid" }
          if ($unsigned) { $unsigned | ForEach-Object { Write-Host "unsigned exe: $($_.FullName)" }; throw "unsigned .exe files in the app folder" }

      - name: Smoke test built app
        run: |
          $env:BLOGVIDEO_HOME = "$PWD\smoke_home"
          $env:BROWSER = "none"
          $p = Start-Process -FilePath "build\app\runtime\pythonw.exe" -ArgumentList "-m","app.launcher" -WorkingDirectory "build\app" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest "http://127.0.0.1:8765/api/info" -UseBasicParsing
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-Content "$env:BLOGVIDEO_HOME\config\logs\app.log" -ErrorAction SilentlyContinue; throw "app did not start" }
          Write-Host "app started OK"

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}".TrimStart("v") }
          & $iscc "/DAppVersion=$version" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem build\installer

      - name: Keyed installer end-to-end (fake key, silent install)
        run: |
          python -c "import pathlib; from app import keybundle; d = pathlib.Path('build/installer/BlogVideo-Setup.exe').read_bytes(); pathlib.Path('keyed.exe').write_bytes(keybundle.embed(d, 'sk-ant-ci-fake-0000'))"
          $p = Start-Process -FilePath ".\keyed.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "install failed: $($p.ExitCode)" }
          $imp = "$env:APPDATA\BlogVideo\import.key"
          if (-not (Test-Path $imp)) { Get-Content install.log -Tail 60; throw "import.key was not written by the installer" }
          $env:BROWSER = "none"
          $inst = "$env:ProgramFiles\BlogVideo"
          if (Test-Path "$inst\BlogVideo.exe") { throw "old unsigned BlogVideo.exe was installed" }
          if ((Get-AuthenticodeSignature "$inst\runtime\pythonw.exe").Status -ne "Valid") { throw "installed pythonw.exe is not signed" }
          Select-String -Path install.log -Pattern "shortcut|\.lnk" -SimpleMatch:$false | ForEach-Object { Write-Host "log: $($_.Line)" }
          $shell = New-Object -ComObject WScript.Shell
          $dirs = @("$env:ProgramData\Microsoft\Windows\Start Menu\Programs", "$env:PUBLIC\Desktop",
                    "$env:APPDATA\Microsoft\Windows\Start Menu\Programs", "$env:USERPROFILE\Desktop")
          $lnks = @(Get-ChildItem $dirs -Recurse -Filter *.lnk -ErrorAction SilentlyContinue |
            ForEach-Object { $shell.CreateShortcut($_.FullName) } | Where-Object { $_.TargetPath -match "pythonw\.exe$" })
          $lnks | ForEach-Object { Write-Host "shortcut: $($_.FullName) -> $($_.TargetPath) $($_.Arguments) (in $($_.WorkingDirectory))" }
          $app_lnks = @($lnks | Where-Object { $_.TargetPath -like "*\BlogVideo\runtime\pythonw.exe" })
          Write-Host "pythonw shortcuts: $($lnks.Count), app shortcuts: $($app_lnks.Count)"
          if ($app_lnks.Count -lt 2) { throw "expected start menu + desktop shortcuts to runtime\pythonw.exe" }
          if ($app_lnks | Where-Object { $_.Arguments -ne "-m app.launcher" -or $_.WorkingDirectory -ne $inst }) { throw "shortcut arguments or folder are wrong" }
          $app = Start-Process -FilePath "$inst\runtime\pythonw.exe" -ArgumentList "-m","app.launcher" -WorkingDirectory $inst -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $info = Invoke-RestMethod "http://127.0.0.1:8765/api/info"; if ($info.has_api_key) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "installed app did not pick up the bundled key" }
          if (Test-Path $imp) { throw "import.key was not removed after import" }
          $cfg = Get-Content "$env:APPDATA\BlogVideo\config.json" -Raw
          if ($cfg -notmatch "anthropic_api_key_enc") { throw "key not stored encrypted" }
          if ($cfg -match "sk-ant-ci-fake") { throw "key stored in plaintext" }
          Write-Host "keyed installer OK: key imported and stored with DPAPI"
          Start-Process -FilePath "$env:ProgramFiles\BlogVideo\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          Remove-Item keyed.exe -Force

      - name: Microsoft Defender scan (fail if anything is detected)
        run: |
          $mp = "$env:ProgramFiles\Windows Defender\MpCmdRun.exe"
          $status = Get-MpComputerStatus -ErrorAction SilentlyContinue
          if (-not $status -or -not $status.AntivirusEnabled) { Write-Warning "Defender is not running on this runner; scan skipped"; exit 0 }
          & $mp -SignatureUpdate | Out-Null
          # 러너의 검사 제외 폴더를 피해서 따로 복사해 검사한다
          $dir = "C:\bv_scan"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item -Recurse build\app "$dir\app"
          Copy-Item build\installer\BlogVideo-Setup.exe $dir
          & $mp -Scan -ScanType 3 -File $dir -DisableRemediation
          $code = $LASTEXITCODE
          Get-MpThreatDetection -ErrorAction SilentlyContinue | Format-List ThreatID, Resources
          if ($code -eq 2) { throw "Microsoft Defender detected a threat in the build" }
          if ($code -ne 0) { Write-Warning "Defender scan exit code $code (scan could not run)"; exit 0 }
          Write-Host "Defender: no threats found (signatures $($status.AntivirusSignatureVersion))"

      - uses: actions/upload-artifact@v4
        with:
          name: BlogVideo-Setup
          path: build/installer/BlogVideo-Setup.exe
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: build/installer/BlogVideo-Setup.exe
